<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign In — SCHOOL WEBSITE</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      :root {
        --bg: #08090a;
        --surface: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f5f5f7;
        --text-muted: #8e8e93;
        --primary: #7f5af0;
        --accent: #2cb67d;
        --primary-glow: rgba(127, 90, 240, 0.4);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        height: 100vh;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .bg-mesh {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.5;
        animation: float 10s ease-in-out infinite;
      }
      .blob-1 {
        width: 500px;
        height: 500px;
        background: var(--primary);
        top: -100px;
        left: -100px;
      }
      .blob-2 {
        width: 400px;
        height: 400px;
        background: var(--accent);
        bottom: -100px;
        right: -100px;
        animation-delay: -5s;
      }
      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(50px, -50px);
        }
      }
      .login-card {
        width: 420px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 2.5rem;
        backdrop-filter: blur(20px) saturate(180%);
        box-shadow:
          0 20px 50px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
        position: relative;
      }
      .logo {
        font-weight: 800;
        font-size: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 2.5rem;
      }
      .logo-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-radius: 8px;
        display: grid;
        place-items: center;
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
      }
      p.sub {
        color: var(--text-muted);
        margin-bottom: 2rem;
      }
      .form-group {
        margin-bottom: 1.2rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
        font-weight: 500;
      }
      .input-wrap {
        position: relative;
      }
      .input-wrap i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        width: 18px;
      }
      .form-input {
        width: 100%;
        padding: 0.9rem 1rem 0.9rem 2.8rem;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-family: "Plus Jakarta Sans";
        outline: none;
        transition: 0.3s;
        font-size: 0.95rem;
      }
      .form-input:focus {
        border-color: var(--primary);
        background: rgba(127, 90, 240, 0.05);
        box-shadow: 0 0 0 4px rgba(127, 90, 240, 0.15);
      }
      .btn-submit {
        width: 100%;
        padding: 0.9rem;
        background: var(--primary);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        font-family: "Plus Jakarta Sans";
        font-size: 1rem;
        margin-top: 0.5rem;
        box-shadow: 0 8px 20px var(--primary-glow);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .btn-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px var(--primary-glow);
      }
      .demo-creds {
        margin-top: 1.5rem;
        padding: 1rem;
        background: rgba(44, 182, 125, 0.05);
        border: 1px dashed rgba(44, 182, 125, 0.3);
        border-radius: 12px;
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.8;
      }
      .demo-creds strong {
        color: var(--accent);
      }
      .error {
        color: #ff6b6b;
        margin-bottom: 1rem;
        font-size: 0.9rem;
        text-align: center;
        padding: 0.5rem;
        background: rgba(255, 107, 107, 0.1);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="bg-mesh">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
    </div>
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">
          <i data-lucide="graduation-cap" style="width: 18px; color: white"></i>
        </div>
        SCHOOL WEBSITE
      </div>
      <h1>Welcome back</h1>
      <p class="sub">Sign in to access your premium portal.</p>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrap">
            <i data-lucide="user"></i
            ><input
              type="text"
              name="username"
              class="form-input"
              placeholder="e.g., student1"
              required
            />
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrap">
            <i data-lucide="lock"></i
            ><input
              type="password"
              name="password"
              class="form-input"
              placeholder="••••••••"
              required
            />
          </div>
        </div>
        <button type="submit" class="btn-submit">
          Sign In <i data-lucide="arrow-right" style="width: 16px"></i>
        </button>
      </form>
      <div class="demo-creds">
        <strong>Demo Credentials:</strong><br />Student: <code>student1</code> /
        <code>pass123</code><br />Teacher: <code>teacher1</code> /
        <code>pass123</code>
      </div>
    </div>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
