{% extends 'base.html' %}
{% block title %}Teacher Login{% endblock %}

{% block styles %}
<style>
    .login-wrap { min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 100px 1.5rem 2rem; }
    .login-card { width: 100%; max-width: 440px; background: #fff; border: 1px solid rgba(27, 94, 32, 0.1); border-radius: 28px; padding: 3rem 2.5rem; animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both; box-shadow: 0 20px 50px rgba(27, 94, 32, 0.1); }
    @keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .login-icon { width: 70px; height: 70px; border-radius: 20px; background: linear-gradient(135deg, #1b5e20, #43a047); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 1.5rem; animation: iconBounce 2s ease-in-out infinite; box-shadow: 0 10px 30px rgba(27, 94, 32, 0.2); }
    @keyframes iconBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .login-card h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; color: #1b5e20; }
    .login-card .subtitle { color: #4a5568; margin-bottom: 2rem; font-size: 0.95rem; }
    .form-group { margin-bottom: 1.3rem; }
    .form-group label { display: block; color: #1b5e20; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.5rem; }
    .input-wrap { position: relative; }
    .input-wrap input { width: 100%; padding: 1rem 1rem 1rem 3rem; background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 12px; color: #333; font-size: 1rem; font-family: 'Inter', sans-serif; transition: all 0.3s ease; }
    .input-wrap input:focus { outline: none; border-color: #43a047; background: #fff; box-shadow: 0 0 0 4px rgba(67, 160, 71, 0.15); }
    .input-wrap .input-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #808080; font-size: 1.1rem; }
    .btn-login { width: 100%; padding: 1rem; background: linear-gradient(135deg, #1b5e20, #43a047); color: #fff; border: none; border-radius: 12px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; transition: all 0.3s ease; box-shadow: 0 8px 25px rgba(27, 94, 32, 0.2); font-family: 'Inter', sans-serif; }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(27, 94, 32, 0.3); }
    .back-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #4a5568; }
    .back-link a { color: #1b5e20; text-decoration: none; font-weight: 500; }
</style>
{% endblock %}

{% block content %}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-icon">🧑‍🏫</div>
        <h1>Teacher Portal</h1>
        <p class="subtitle">Sign in to manage and upload student results.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <input type="text" name="username" required autocomplete="username" placeholder="Enter your username">
                    <span class="input-icon">👤</span>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <input type="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                    <span class="input-icon">🔒</span>
                </div>
            </div>
            <button type="submit" class="btn-login">Sign In →</button>
        </form>
        <div class="back-link">← <a href="{% url 'home' %}">Back to home</a></div>
    </div>
</div>
{% endblock %}
